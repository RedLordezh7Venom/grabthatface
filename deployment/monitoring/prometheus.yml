global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'grabthatface-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # GrabThatFace API metrics
  - job_name: 'grabthatface-api'
    static_configs:
      - targets: ['api-service:8000']  # For Kubernetes
        # - targets: ['localhost:8000']  # For bare metal
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL metrics (requires postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis metrics (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Qdrant metrics
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant-service:6333']
    metrics_path: '/metrics'

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Celery metrics (requires flower or custom exporter)
  - job_name: 'celery'
    static_configs:
      - targets: ['celery-exporter:9808']

apiVersion: v1
kind: ConfigMap
metadata:
  name: grabthatface-config
  namespace: grabthatface
data:
  # API Settings
  PROJECT_NAME: "GrabThatFace Production"
  API_V1_STR: "/api/v1"
  ENVIRONMENT: "production"
  
  # Database
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "40"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "3600"
  
  # Qdrant
  QDRANT_HOST: "qdrant-service"
  QDRANT_PORT: "6333"
  QDRANT_GRPC_PORT: "6334"
  QDRANT_COLLECTION_NAME: "face_embeddings"
  
  # Redis
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  
  # ML Settings
  FACE_MODEL_NAME: "buffalo_l"
  FACE_RECOGNITION_TOLERANCE: "0.45"
  VECTOR_DIMENSION: "512"
  DETECTION_THRESHOLD: "0.5"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_UPLOAD_PER_HOUR: "100"
  
  # Server
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"
  
  # Celery
  CELERY_WORKER_CONCURRENCY: "4"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "2"
  
  # Monitoring
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  MLFLOW_TRACKING_URI: "http://mlflow-service:5000"

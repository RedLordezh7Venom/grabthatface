apiVersion: v1
kind: Secret
metadata:
  name: grabthatface-secrets
  namespace: grabthatface
type: Opaque
stringData:
  # Change these in production!
  SECRET_KEY: "YOUR_PRODUCTION_SECRET_KEY_CHANGE_ME"
  DATABASE_URL: "postgresql+asyncpg://grabthatface:grabthatface_pass@postgres-service:5432/grabthatface"
  QDRANT_API_KEY: ""  # Leave empty for local Qdrant, set for Qdrant Cloud
